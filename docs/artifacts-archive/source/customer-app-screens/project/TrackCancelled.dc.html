<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracking · cancelled</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/irondost/tokens.css">
<link rel="stylesheet" href="ds/irondost/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
  <div class="safe-top" style="background: var(--surface)"></div>
  <header class="id-appbar" style="flex: none; box-shadow: inset 0 -1px 0 var(--border)">
    <a class="id-iconbtn" href="OrdersPast.dc.html" aria-label="Back"><svg class="id-icon lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <h1 class="id-appbar__title">Order <span style="font-family: var(--font-mono); font-weight: 500">ID001046</span></h1>
  </header>
  <main class="main" style="padding-top: 16px; gap: 16px">
    <section style="display: grid; gap: 4px; padding: 20px; border-radius: var(--radius-xl); background: var(--surface-soft)" aria-label="Status">
      <span class="id-chip id-chip--neutral" style="width: fit-content; background: var(--surface)">Cancelled</span>
      <h2 class="headline" style="margin-top: 6px">You cancelled this order</h2>
      <p class="body muted">Fri 2 Oct, 2:14 PM · "I booked by mistake"</p>
    </section>
    <div class="notice notice--info">
      <svg class="id-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
      <span>Your ₹248 refund is on its way to the account you paid from. Refunds take 7–14 business days.</span>
    </div>
    <section class="id-card" style="display: grid; gap: 10px" aria-label="What you booked">
      <div class="id-bill__row"><span class="muted">Was booked for</span><span>Fri 2 Oct, 4 – 8 PM</span></div>
      <div class="id-bill__row"><span class="muted">Items</span><span>17 · Ironing</span></div>
      <div class="id-bill__row"><span class="muted">Amount</span><span>₹248 · refund pending</span></div>
    </section>
  </main>
  <div class="footer">
    <a class="id-btn id-btn--primary id-btn--block" href="Cart.dc.html">Book again</a>
    <div class="safe-bottom" style="height: 26px"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
