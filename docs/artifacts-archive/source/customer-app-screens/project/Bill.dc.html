<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Items and bill</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/irondost/tokens.css">
<link rel="stylesheet" href="ds/irondost/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
  <div class="safe-top" style="background: var(--surface)"></div>
  <header class="id-appbar" style="flex: none; box-shadow: inset 0 -1px 0 var(--border)">
    <a class="id-iconbtn" href="TrackDelivered.dc.html" aria-label="Back"><svg class="id-icon lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <h1 class="id-appbar__title">Items and bill</h1>
  </header>
  <main class="main" style="padding-top: 16px; gap: 16px">
    <section class="id-card" style="display: grid; gap: 4px" aria-label="Order">
      <div class="id-order__head"><span class="order-id">ID001042</span><span class="id-chip id-chip--success"><svg class="id-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Paid</span></div>
      <p class="caption muted">Picked up Thu 1 Oct · Delivered Sat 3 Oct</p>
    </section>
    <section class="id-card" style="padding: 4px 16px" aria-label="Items">
      <div class="sec-head" style="padding: 12px 0 4px"><h2 class="title">Ironing</h2><span class="caption muted">Counted at pickup</span></div>
      <div class="id-item"><span class="id-item__body"><span class="id-item__name">Shirt / T-shirt</span><span class="caption muted">8 × ₹15</span></span><span class="label" style="font-variant-numeric: tabular-nums">₹120</span></div>
      <div class="id-item"><span class="id-item__body"><span class="id-item__name">Trousers / Jeans</span><span class="caption muted">2 × ₹15</span></span><span class="label" style="font-variant-numeric: tabular-nums">₹30</span></div>
      <div class="id-item"><span class="id-item__body"><span class="id-item__name">Kurta</span><span class="caption muted">1 × ₹20</span></span><span class="label" style="font-variant-numeric: tabular-nums">₹20</span></div>
      <div class="id-item"><span class="id-item__body"><span class="id-item__name">Dupatta</span><span class="caption muted">1 × ₹10</span></span><span class="label" style="font-variant-numeric: tabular-nums">₹10</span></div>
    </section>
    <section class="id-card" aria-label="Bill">
      <div class="id-bill">
        <div class="id-bill__row"><span>Items (12)</span><span>₹180</span></div>
        <div class="id-bill__row id-bill__row--muted"><span>Pickup &amp; delivery</span><span>Free</span></div>
        <div class="id-bill__total"><span>Total</span><span>₹180</span></div>
        <div class="id-bill__row id-bill__row--saving"><span>Paid in cash · Sat 3 Oct</span><span>₹180</span></div>
        <div class="id-bill__row"><span>Due</span><span>₹0</span></div>
      </div>
    </section>
  </main>
  <div class="safe-bottom"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
