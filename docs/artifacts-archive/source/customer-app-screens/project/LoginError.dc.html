<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · invalid number</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/irondost/tokens.css">
<link rel="stylesheet" href="ds/irondost/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" data-theme="{{theme}}" style="background: var(--surface)">
  <div class="safe-top"></div>
  <header class="id-appbar" style="flex: none">
    <a class="id-iconbtn" href="Welcome.dc.html" aria-label="Back"><svg class="id-icon lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
  </header>
  <main class="main" style="padding: 24px 16px; gap: 32px">
    <div style="display: grid; gap: 8px">
      <h1 class="headline">Enter your mobile number</h1>
      <p class="body-lg muted">We'll send a 6-digit code to verify it.</p>
    </div>
    <label class="id-field">
      <span class="id-field__label">Mobile number</span>
      <span class="id-field__control is-error"><span class="id-field__prefix">+91</span><input type="tel" inputmode="numeric" autocomplete="tel-national" value="98765 4321" aria-invalid="true" aria-describedby="phone-error"></span>
      <span id="phone-error" class="id-field__error" role="alert"><svg class="id-icon sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>Enter a 10-digit mobile number.</span>
    </label>
  </main>
  <div style="flex: none; display: grid; gap: 12px; padding: 12px 16px 0">
    <span class="id-btn id-btn--primary id-btn--block is-disabled" aria-disabled="true">Get OTP</span>
    <p class="caption muted" style="text-align: center">By continuing you agree to our <a href="Legal.dc.html">Terms</a> and <a href="Legal.dc.html">Privacy Policy</a>.</p>
  </div>
  <div class="safe-bottom"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
