<div class="scr" data-theme="{{theme}}" style="background: var(--surface)">

  <div style="flex: none; display: flex; justify-content: center; padding-top: 12px">

  <main class="main" style="justify-content: center; gap: 28px; padding: 16px 24px">

    </div>

      <h1 class="headline">Fresh clothes, back at your door.</h1>
      <p class="body-lg muted">We pick up, iron and deliver. You choose the time.</p>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: grid; gap: 12px">
      <li style="display: flex; align-items: center; gap: 12px"><span class="tile40"><svg class="id-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path><path d="M15 18H9"></path><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path><circle cx="17" cy="18" r="2"></circle><circle cx="7" cy="18" r="2"></circle></svg></span><span class="body">Pickup and delivery from your door</span></li>

  </div>
  <div class="safe-bottom"></div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
