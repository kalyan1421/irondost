<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Something went wrong</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/irondost/tokens.css">
<link rel="stylesheet" href="ds/irondost/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" data-theme="{{theme}}" style="background: var(--surface)">
  <div class="safe-top"></div>
  <header class="id-appbar" style="flex: none">
    <a class="id-iconbtn" href="Main.dc.html" aria-label="Back"><svg class="id-icon lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
  </header>
  <main class="main" style="justify-content: center; align-items: center; gap: 16px; padding: 24px; text-align: center" role="alert">
    <span style="width: 120px; height: 120px; display: grid; place-items: center; border-radius: 50%; background: var(--danger-soft); color: var(--danger)">
      <svg viewBox="0 0 24 24" width="52" height="52" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
    </span>
    <h1 class="headline" style="margin-top: 8px">Something went wrong</h1>
    <p class="body-lg muted" style="max-width: 310px">We couldn't open this page. Try again, and if it keeps happening, let us know.</p>
    <p class="caption muted">Error 500 · We've been notified</p>
  </main>
  <div style="flex: none; display: grid; gap: 4px; padding: 12px 16px 0">
    <a class="id-btn id-btn--primary id-btn--block" href="Main.dc.html">Try again</a>
    <a class="id-btn id-btn--text id-btn--block" href="Help.dc.html">Contact support</a>
  </div>
  <div class="safe-bottom"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
