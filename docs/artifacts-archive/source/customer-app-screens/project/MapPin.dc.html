<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up · pin location</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/irondost/tokens.css">
<link rel="stylesheet" href="ds/irondost/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
  <div class="map" role="img" aria-label="Map of Banjara Hills with the pin on Road No. 12">
    <span class="map__park" style="left: 210px; top: 96px; width: 200px; height: 150px"></span>
    <span class="map__block" style="left: 18px; top: 70px; width: 110px; height: 96px; background: var(--border)"></span>
    <span class="map__block" style="left: 18px; top: 214px; width: 110px; height: 120px; background: var(--border)"></span>
    <span class="map__block" style="left: 168px; top: 300px; width: 90px; height: 110px; background: var(--border)"></span>
    <span class="map__block" style="left: 300px; top: 300px; width: 100px; height: 110px; background: var(--border)"></span>
    <span class="map__block" style="left: 18px; top: 382px; width: 110px; height: 90px; background: var(--border)"></span>
    <span class="map__block" style="left: 168px; top: 458px; width: 232px; height: 70px; background: var(--border)"></span>
    <span class="map__road" style="left: 0; top: 178px; width: 390px; height: 20px"></span>
    <span class="map__road" style="left: 0; top: 428px; width: 390px; height: 16px"></span>
    <span class="map__road" style="left: 140px; top: 0; width: 18px; height: 620px"></span>
    <span class="map__road" style="left: 270px; top: 250px; width: 16px; height: 370px"></span>
  </div>
  <div style="position: relative; flex: none">
    <div class="safe-top"></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 16px">
      <a class="id-iconbtn" href="Profile.dc.html" aria-label="Back" style="flex: none; background: var(--surface); box-shadow: var(--shadow-raised)"><svg class="id-icon lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
      <label class="id-field__control" style="flex: 1; box-shadow: var(--shadow-raised)">
        <svg class="id-icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="search" placeholder="Search area, street or building" aria-label="Search for a place">
      </label>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 268px; display: grid; justify-items: center; gap: 6px">
    <span class="caption" style="padding: 6px 10px; border-radius: var(--radius-sm); background: var(--surface-inverse); color: var(--text-inverse)">Your pickup point</span>
    <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" style="fill: var(--royal); stroke: var(--white); stroke-width: 1.5"></path><circle cx="12" cy="10" r="3" style="fill: var(--white)"></circle></svg>
  </div>
  <a class="id-iconbtn" href="#locate" aria-label="Use my current location" style="position: absolute; right: 16px; top: 520px; background: var(--surface); color: var(--primary); box-shadow: var(--shadow-raised)"><svg class="id-icon lg" viewBox="0 0 24 24" aria-hidden="true"><line x1="2" x2="5" y1="12" y2="12"></line><line x1="19" x2="22" y1="12" y2="12"></line><line x1="12" x2="12" y1="2" y2="5"></line><line x1="12" x2="12" y1="19" y2="22"></line><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="3"></circle></svg></a>
  <section class="sheet" aria-label="Selected location">
    <span class="grabber"></span>
    <div style="display: grid; gap: 4px">
      <span class="caption muted">Step 2 of 2 · Pickup address</span>
      <h1 class="title-lg">Road No. 12, Banjara Hills</h1>
      <p class="body muted">Hyderabad, Telangana 500034</p>
    </div>
    <div class="notice notice--info">
      <svg class="id-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <span>Move the map so the pin sits on your building.</span>
    </div>
    <a class="id-btn id-btn--primary id-btn--block" href="AddressForm.dc.html">Confirm location</a>
    <div class="safe-bottom" style="margin-top: -16px"></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
