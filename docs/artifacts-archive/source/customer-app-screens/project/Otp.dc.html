<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · OTP</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/irondost/tokens.css">
<link rel="stylesheet" href="ds/irondost/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" data-theme="{{theme}}" style="background: var(--surface)">
  <div class="safe-top"></div>
  <header class="id-appbar" style="flex: none">
    <a class="id-iconbtn" href="Login.dc.html" aria-label="Back"><svg class="id-icon lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
  </header>
  <main class="main" style="padding: 24px 16px; gap: 28px">
    <div style="display: grid; gap: 8px">
      <h1 class="headline">Enter the code</h1>
      <p class="body-lg muted">Sent by SMS to +91 98765 43210. <a class="label" href="Login.dc.html">Change</a></p>
    </div>
    <div style="display: grid; gap: 12px">
      <span class="id-field__label">6-digit code</span>
      <div class="id-otp" role="group" aria-label="Verification code, 6 digits" style="gap: 10px">
        <span class="id-otp__box">4</span>
        <span class="id-otp__box">8</span>
        <span class="id-otp__box">2</span>
        <span class="id-otp__box">9</span>
        <span class="id-otp__box">1</span>
        <span class="id-otp__box is-active">6</span>
      </div>
      <p class="body muted">Resend code in 0:24</p>
    </div>
    <div class="notice notice--info">
      <svg class="id-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
      <span>We fill the code in for you when the SMS arrives.</span>
    </div>
  </main>
  <div style="flex: none; padding: 12px 16px 0">
    <a class="id-btn id-btn--primary id-btn--block" href="Profile.dc.html">Verify</a>
  </div>
  <div class="safe-bottom"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
