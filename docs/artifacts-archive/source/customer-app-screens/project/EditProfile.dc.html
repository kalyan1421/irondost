<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/irondost/tokens.css">
<link rel="stylesheet" href="ds/irondost/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" data-theme="{{theme}}" style="background: var(--surface)">
  <div class="safe-top"></div>
  <header class="id-appbar" style="flex: none; box-shadow: inset 0 -1px 0 var(--border)">
    <a class="id-iconbtn" href="Account.dc.html" aria-label="Back"><svg class="id-icon lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <h1 class="id-appbar__title">Edit profile</h1>
  </header>
  <main class="main" style="padding-top: 24px; gap: 24px">
    <span class="avatar" style="align-self: center; width: 80px; height: 80px; font-size: 28px">PS</span>
    <label class="id-field">
      <span class="id-field__label">Full name</span>
      <span class="id-field__control is-focus"><input type="text" autocomplete="name" value="Priya Sharma"></span>
    </label>
    <label class="id-field">
      <span class="id-field__label">Email (optional)</span>
      <span class="id-field__control"><input type="email" autocomplete="email" placeholder="you@example.com"></span>
      <span class="id-field__help">For receipts.</span>
    </label>
    <div class="id-field">
      <span class="id-field__label">Mobile number</span>
      <span class="id-field__control" style="background: var(--surface-soft); box-shadow: none" aria-readonly="true"><span class="id-field__prefix">+91</span><span style="flex: 1">98765 43210</span><svg class="id-icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted)"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
      <span class="id-field__help">Your number signs you in. To change it, <a href="Help.dc.html">contact support</a>.</span>
    </div>
  </main>
  <div style="flex: none; padding: 12px 16px 0">
    <a class="id-btn id-btn--primary id-btn--block" href="Account.dc.html">Save changes</a>
  </div>
  <div class="safe-bottom"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
