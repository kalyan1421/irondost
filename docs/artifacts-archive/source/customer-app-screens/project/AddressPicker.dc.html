<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · switch address</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/irondost/tokens.css">
<link rel="stylesheet" href="ds/irondost/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
  <div class="under" aria-hidden="true">
    <dc-import name="Main" theme="{{theme}}" hint-size="390px,844px"></dc-import>
  </div>
  <a class="scrim" href="Main.dc.html" aria-label="Close"></a>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <span class="grabber"></span>
    <h1 id="picker-title" class="title-lg">Pick up from</h1>
    <div class="id-stack" role="radiogroup" aria-labelledby="picker-title" style="gap: 8px">
      <a class="id-addr is-selected" href="Main.dc.html" role="radio" aria-checked="true" style="padding: 14px 16px">
        <span class="id-addr__icon"><svg class="id-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>
        <span style="flex: 1; display: grid; gap: 2px"><span class="id-addr__label" style="color: var(--text)">Home</span><span class="id-addr__text">302, Sai Residency, Road No. 12, Banjara Hills</span></span>
        <span class="id-radio is-on" style="margin-top: 10px"></span>
      </a>
      <a class="id-addr" href="Main.dc.html" role="radio" aria-checked="false" style="padding: 14px 16px">
        <span class="id-addr__icon"><svg class="id-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><rect width="20" height="14" x="2" y="6" rx="2"></rect></svg></span>
        <span style="flex: 1; display: grid; gap: 2px"><span class="id-addr__label" style="color: var(--text)">Work</span><span class="id-addr__text">4th floor, Cyber Towers, HITEC City</span></span>
        <span class="id-radio" style="margin-top: 10px"></span>
      </a>
      <span class="id-addr" role="radio" aria-checked="false" aria-disabled="true" style="padding: 14px 16px; opacity: 0.6">
        <span class="id-addr__icon"><svg class="id-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span>
        <span style="flex: 1; display: grid; gap: 4px"><span class="id-addr__label">Parents</span><span class="id-addr__text">12, ISB Road, Gachibowli</span><span class="id-chip id-chip--neutral" style="width: fit-content; height: 24px">Not in our area yet</span></span>
      </span>
    </div>
    <a class="id-btn id-btn--tonal id-btn--block" href="MapPin.dc.html"><svg class="id-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Add new address</a>
    <div class="safe-bottom" style="margin-top: -16px"></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
