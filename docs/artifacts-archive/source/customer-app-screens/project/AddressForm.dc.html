<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up · address details</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/irondost/tokens.css">
<link rel="stylesheet" href="ds/irondost/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" data-theme="{{theme}}">
  <div class="safe-top" style="background: var(--surface)"></div>
  <header class="id-appbar" style="flex: none; box-shadow: inset 0 -1px 0 var(--border)">
    <a class="id-iconbtn" href="MapPin.dc.html" aria-label="Back"><svg class="id-icon lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <h1 class="id-appbar__title">Address details</h1>
  </header>
  <main class="main" style="padding-top: 16px; gap: 20px">
    <div class="rowcard">
      <span class="tile40"><svg class="id-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span>
      <span style="flex: 1; display: grid"><span class="title">Road No. 12, Banjara Hills</span><span class="body muted">Hyderabad 500034</span></span>
      <a class="label" href="MapPin.dc.html">Change</a>
    </div>
    <label class="id-field">
      <span class="id-field__label">Flat or house number</span>
      <span class="id-field__control"><input type="text" value="302"></span>
    </label>
    <label class="id-field">
      <span class="id-field__label">Building or apartment</span>
      <span class="id-field__control"><input type="text" value="Sai Residency"></span>
    </label>
    <label class="id-field">
      <span class="id-field__label">Landmark (optional)</span>
      <span class="id-field__control is-focus"><input type="text" value="Near KBR Park gate"></span>
      <span class="id-field__help">Helps your partner find you faster.</span>
    </label>
    <fieldset style="margin: 0; padding: 0; border: 0; display: grid; gap: 8px">
      <legend class="id-field__label" style="padding: 0; margin-bottom: 8px">Save as</legend>
      <div class="id-row" style="gap: 8px">
        <span class="id-chip pick is-on"><svg class="id-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Home</span>
        <span class="id-chip pick"><svg class="id-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><rect width="20" height="14" x="2" y="6" rx="2"></rect></svg>Work</span>
        <span class="id-chip pick">Other</span>
      </div>
    </fieldset>
    <div style="display: flex; align-items: center; gap: 12px">
      <span class="body-lg" style="flex: 1">Use as my default address</span>
      <span class="switch" role="switch" aria-checked="true" aria-label="Use as my default address"></span>
    </div>
  </main>
  <div class="footer">
    <a class="id-btn id-btn--primary id-btn--block" href="Main.dc.html">Save address</a>
    <div class="safe-bottom" style="height: 26px"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
