<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch screen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/irondost/tokens.css">
<link rel="stylesheet" href="ds/irondost/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" data-theme="{{theme}}" style="background: var(--surface); align-items: center; justify-content: center">
  <sc-if value="{{dark}}" hint-placeholder-val="{{false}}">
    <img src="/_blob/348214e430c962c417423322bd5b1144" alt="IronDost" style="width: 220px; height: auto">
  </sc-if>
  <sc-if value="{{light}}" hint-placeholder-val="{{true}}">
    <img src="/_blob/662db2cf96eabe70e90aff0190daff54" alt="IronDost. Wash, iron, deliver." style="width: 240px; height: auto">
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    return { theme, dark: theme === 'dark', light: theme !== 'dark' };
  }
}
</script>
</body>
</html>
