<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<style>
/* Layout: handbook. Fixed sidebar of grouped documents on the left, one reading column on the right; on phones the sidebar becomes a picker. */
:root {
  --bg:#F1F4F8; --surface:#FFFFFF; --ink:#0E1E3D; --muted:#5B6B86; --line:#DCE4EE;
  --accent:#1F4FD1; --sky:#3FB8EA; --sun:#FFC93C; --soft:#E6EEF8;
  --display:"Outfit","Figtree",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0A1428; --surface:#0F1D3A; --ink:#E8EEF8; --muted:#94A3BE; --line:#22355C;
  --accent:#86A8FF; --sky:#3FB8EA; --sun:#FFC93C; --soft:#16274A; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0A1428; --surface:#0F1D3A; --ink:#E8EEF8; --muted:#94A3BE; --line:#22355C;
  --accent:#86A8FF; --sky:#3FB8EA; --sun:#FFC93C; --soft:#16274A; color-scheme:dark; }
body { background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15.5px; line-height:1.6; }
.shell { display:grid; grid-template-columns:280px minmax(0,1fr); min-height:100vh; }
aside { position:sticky; top:env(safe-area-inset-top,0px); align-self:start; height:100vh; overflow-y:auto;
  border-right:1px solid var(--line); background:var(--surface);
  padding-block:24px 40px; padding-left:max(18px, env(safe-area-inset-left,0px)); padding-right:18px; }
.brand { font-family:var(--display); font-weight:700; font-size:1.25rem; line-height:1.2; }
.kicker { font:600 11px var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:4px; }
#filter { width:100%; box-sizing:border-box; margin-top:16px; font:14px var(--body); padding:8px 10px;
  border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
nav h4 { font:600 11px var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:22px 0 6px; }
nav a { display:flex; justify-content:space-between; gap:8px; padding:6px 10px; border-radius:7px;
  color:var(--ink); text-decoration:none; font-size:14px; }
nav a small { color:var(--muted); font:11px var(--mono); white-space:nowrap; padding-top:2px; }
nav a:hover { background:var(--soft); }
nav a[aria-current="page"] { background:var(--ink); color:var(--bg); }
nav a[aria-current="page"] small { color:var(--bg); opacity:.7; }
nav a:focus-visible, #filter:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.gallery { display:block; margin-top:22px; padding:10px 12px; border:1px dashed var(--accent); border-radius:8px;
  color:var(--accent); text-decoration:none; font-size:14px; font-weight:600; }
main { min-width:0; padding-block:28px 80px; padding-left:clamp(16px,4vw,56px); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.picker { display:none; }
article { max-width:860px; }
article h1 { font-family:var(--display); font-size:clamp(1.6rem,3vw,2.2rem); line-height:1.15; margin:0 0 12px; text-wrap:balance; }
article h2 { font-family:var(--display); font-size:1.35rem; margin:36px 0 10px; text-wrap:balance; padding-top:12px; border-top:1px solid var(--line); }
article h3 { font-family:var(--display); font-size:1.1rem; margin:26px 0 8px; }
article h4 { font-size:1rem; margin:20px 0 6px; }
article p, article li { max-width:72ch; }
article a { color:var(--accent); }
article code { font-family:var(--mono); font-size:.86em; background:var(--soft); padding:1px 5px; border-radius:4px; }
article pre { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px; overflow-x:auto; font-size:13px; line-height:1.5; }
article pre code { background:none; padding:0; white-space:pre-wrap; }
article blockquote { margin:12px 0; padding:4px 14px; border-left:3px solid var(--sun); color:var(--muted); }
.tw { overflow-x:auto; margin:14px 0; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
article table { border-collapse:collapse; width:100%; font-size:14px; }
article th, article td { text-align:left; vertical-align:top; padding:8px 11px; border-bottom:1px solid var(--line); }
article th { background:var(--soft); font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
article tr:last-child td { border-bottom:0; }
article hr { border:0; border-top:1px solid var(--line); margin:28px 0; }
.meta { font:12px var(--mono); color:var(--muted); margin-bottom:18px; }
.err { color:var(--muted); }
@media (max-width:860px) {
  .shell { grid-template-columns:minmax(0,1fr); }
  aside { display:none; }
  .picker { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
  .picker select { font:15px var(--body); padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); max-width:100%; }
  .picker .brand { font-size:1.15rem; }
}
</style>
<div class="shell">
  <aside>
    <div class="brand">__TITLE__</div>
    <div class="kicker">__KICKER__</div>
    <input id="filter" type="search" placeholder="Filter documents" aria-label="Filter documents">
    <nav id="nav" aria-label="Documents"></nav>
    <a class="gallery" id="gal" href="gallery.html" target="_blank" hidden>Open the image gallery ↗</a>
  </aside>
  <main>
    <div class="picker">
      <div class="brand">__TITLE__</div>
      <label for="pick" class="kicker">Document</label>
      <select id="pick"></select>
    </div>
    <div class="meta" id="meta"></div>
    <article id="doc"><p class="err">Loading…</p></article>
  </main>
</div>
<script>
const NAV = __NAV__;
const HAS_GALLERY = __GALLERY__;
const all = NAV.flatMap(g => g.items);
const nav = document.getElementById("nav"), pick = document.getElementById("pick");
if (HAS_GALLERY) document.getElementById("gal").hidden = false;
NAV.forEach(g => {
  const h = document.createElement("h4"); h.textContent = g.group; nav.appendChild(h);
  const og = document.createElement("optgroup"); og.label = g.group; pick.appendChild(og);
  g.items.forEach(it => {
    const a = document.createElement("a"); a.href = "#" + it.id; a.dataset.id = it.id;
    a.innerHTML = `<span></span><small>${it.words >= 1000 ? (it.words/1000).toFixed(1)+"k" : it.words} w</small>`;
    a.firstChild.textContent = it.label; nav.appendChild(a);
    const o = document.createElement("option"); o.value = it.id; o.textContent = it.label; og.appendChild(o);
  });
});
if (HAS_GALLERY) { const o = document.createElement("option"); o.value = "__gallery"; o.textContent = "Image gallery ↗"; pick.appendChild(o); }
pick.addEventListener("change", () => { if (pick.value === "__gallery") { location.href = "gallery.html"; return; } location.hash = pick.value; });
document.getElementById("filter").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  nav.querySelectorAll("a").forEach(a => a.hidden = q && !a.textContent.toLowerCase().includes(q));
});
const cache = {};
async function show() {
  const id = (location.hash || "").slice(1);
  const it = all.find(x => x.id === id) || all[0];
  nav.querySelectorAll("a").forEach(a => a.removeAttribute("aria-current"));
  nav.querySelector(`a[data-id="${it.id}"]`)?.setAttribute("aria-current", "page");
  pick.value = it.id;
  const doc = document.getElementById("doc");
  document.getElementById("meta").textContent = `${it.label} · ${it.words.toLocaleString("en-IN")} words`;
  try {
    if (!cache[it.id]) { const r = await fetch("docs/" + it.id + ".md"); if (!r.ok) throw 0; cache[it.id] = await r.text(); }
    doc.innerHTML = marked.parse(cache[it.id], { mangle:false, headerIds:false });
    doc.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tw"; t.replaceWith(w); w.appendChild(t); });
    doc.querySelectorAll("a[href]").forEach(a => { if (!/^https?:/.test(a.getAttribute("href")) && !a.getAttribute("href").startsWith("#")) { a.removeAttribute("href"); } else if (/^https?:/.test(a.href)) a.target = "_blank"; });
  } catch { doc.innerHTML = '<p class="err">This document could not be loaded. Reload the page to try again.</p>'; }
  window.scrollTo(0, 0);
}
addEventListener("hashchange", show);
show();
</script>
