# Render Blueprint for IronDost: the API (Docker) and the admin console (Node), both on Render.
# The database is the IronDost Supabase project's Postgres, and uploaded images go to a public bucket in the same
# project, so nothing else is created on Render. Background jobs (pg-boss) run inside the API process and keep their
# state in that database, so there is no separate worker or Redis to deploy.
#
# Values marked `sync: false` are secrets or per-environment settings. Render asks for them when the
# Blueprint is first applied; they are never stored in this file. See docs/api-deploy-render.md.
services:
  - type: web
    name: irondost-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    plan: free # sleeps after 15 minutes idle, which stalls order jobs and push; move to starter before launch
    healthCheckPath: /v1/health
    autoDeploy: false # deploy on purpose, from the dashboard or `render deploys create`
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase → Connect → Session pooler (reachable over IPv4, port 5432). Supabase's direct host is IPv6 only on the free plan.
      # Not the transaction pooler (port 6543): Prisma migrations and prepared statements need session mode.
      - key: DATABASE_URL
        sync: false
      # Prisma and pg-boss each open up to this many connections. 2 x 5 stays under the pooler's free-tier limit of 15.
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: APP_NAME
        value: IronDost
      - key: ORDER_NUMBER_PREFIX
        value: ID
      - key: LOG_LEVEL
        value: info
      - key: AUTH_DEV_BYPASS
        value: "false"
      # Browser origins allowed to call the API: the marketing site and the admin below. The mobile app does not need CORS.
      - key: CORS_ORIGINS
        value: https://irondost-app.web.app,https://irondost-admin.onrender.com
      # Firebase service account JSON for the irondost-app project, base64-encoded.
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      # Razorpay keys (test keys while testing, live keys at launch).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Generated by Render. Read it from the service's Environment tab and paste it into the Razorpay webhook
      # (https://<api-url>/v1/webhooks/razorpay) when you add one. Checkout payments work without the webhook.
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true
      # Production refuses to start with local disk storage. Images go to a public bucket in the IronDost Supabase project.
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        value: https://gsqcgqgsatppgccuiqbb.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: irondost-uploads
      # Supabase dashboard → Project Settings → API Keys → the secret key (service_role). Server-side only.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Admin console: a Next.js app that talks only to the API. The NEXT_PUBLIC_* values are compiled into the browser
  # bundle, so they are public by design: the API address and the Firebase *web* config (not a secret; the real
  # protection is that the API checks every request).
  - type: web
    name: irondost-admin
    runtime: node
    region: singapore
    plan: free # sleeps when idle like the API; fine for a back-office tool, upgrade to starter to keep it awake
    buildCommand: pnpm install --frozen-lockfile --filter @laundry/admin... && pnpm --filter @laundry/admin build
    startCommand: pnpm --filter @laundry/admin exec next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /login
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_API_URL
        value: https://irondost-api.onrender.com
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyB9uTZR0kqg21VrrtTYo2oozFpZ29lUpLg
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: irondost-app.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: irondost-app
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: 1:264618787416:web:1a737dfa290441f9c7c02d
      # Local-development shortcut that skips the SMS code. Must stay off here.
      - key: NEXT_PUBLIC_AUTH_DEV_BYPASS
        value: "false"
