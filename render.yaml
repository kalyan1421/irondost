# Render Blueprint for the IronDost API: one Docker web service plus one Postgres database.
# Background jobs (pg-boss) run inside the API process and keep their state in the same database,
# so there is no separate worker or Redis to deploy.
#
# Values marked `sync: false` are secrets or per-environment settings. Render asks for them when the
# Blueprint is first applied; they are never stored in this file. See docs/api-deploy-render.md.
databases:
  - name: irondost-db
    databaseName: irondost
    user: irondost
    region: singapore # closest Render region to Hyderabad
    plan: free # expires 30 days after creation; move to basic-256mb before real customers
    ipAllowList: [] # internal connections only; the API reaches it over Render's private network

services:
  - type: web
    name: irondost-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    plan: free # sleeps after 15 minutes idle, which stalls order jobs and push; move to starter before launch
    healthCheckPath: /v1/health
    autoDeploy: false # deploy on purpose, from the dashboard or `render deploys create`
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: irondost-db
          property: connectionString
      - key: APP_NAME
        value: IronDost
      - key: ORDER_NUMBER_PREFIX
        value: ID
      - key: LOG_LEVEL
        value: info
      - key: AUTH_DEV_BYPASS
        value: "false"
      # Browser origins allowed to call the API (admin site, marketing site). The mobile app does not need CORS.
      - key: CORS_ORIGINS
        sync: false
      # Firebase service account JSON for the irondost-app project, base64-encoded.
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      # Razorpay keys (test keys while testing, live keys at launch).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Generated by Render. Read it from the service's Environment tab and paste it into the Razorpay webhook
      # (https://<api-url>/v1/webhooks/razorpay) when you add one. Checkout payments work without the webhook.
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true
      # Production refuses to start with local disk storage. Images go to Supabase Storage through its S3 protocol.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        value: irondost-uploads # a public bucket
      # Supabase project gsqcgqgsatppgccuiqbb (ap-southeast-1). Its S3 endpoint, region and public bucket URL are not secret.
      - key: S3_ENDPOINT
        value: https://gsqcgqgsatppgccuiqbb.storage.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: ap-southeast-1
      - key: STORAGE_PUBLIC_BASE_URL
        value: https://gsqcgqgsatppgccuiqbb.supabase.co/storage/v1/object/public/irondost-uploads
      # Supabase S3 access key pair (Project Settings → Storage → S3 Connection). The AWS SDK reads these names.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
