include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated: the API client (swagger_parser + build_runner) and Firebase options.
    - lib/data/api/**
    - lib/firebase_options.dart
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - always_declare_return_types
    - avoid_dynamic_calls
