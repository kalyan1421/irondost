name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, lint, unit and e2e tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # prisma generate reads prisma.config.ts, which needs the variable to exist; it never connects.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The e2e run creates and drops its own throwaway database on this server.
      TEST_DATABASE_SERVER_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @laundry/api exec prisma generate
      - run: pnpm --filter @laundry/api typecheck
      - run: pnpm --filter @laundry/api lint
      - run: pnpm --filter @laundry/api test
      - run: pnpm --filter @laundry/api test:e2e
      - name: The OpenAPI contract matches the code
        run: |
          pnpm --filter @laundry/api openapi
          git diff --exit-code packages/contracts/openapi.json

  admin:
    name: Admin (typed client, typecheck, lint, build)
    runs-on: ubuntu-latest
    env:
      # pnpm install also runs apps/api's postinstall (prisma generate). That reads prisma.config.ts, which needs the
      # variable to exist; it never connects. A placeholder, as in apps/api/Dockerfile.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The typed API client matches the contract
        run: |
          pnpm --filter @laundry/admin gen:api
          git diff --exit-code apps/admin/src/lib/api/schema.d.ts
      - run: pnpm --filter @laundry/admin exec tsc --noEmit
      - run: pnpm --filter @laundry/admin lint
      - run: pnpm --filter @laundry/admin build

  customer:
    name: Customer app (analyze and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
